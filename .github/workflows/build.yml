name: TDR Tag and pre deploy
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  pre-deploy:
    uses: nationalarchives/tdr-github-actions/.github/workflows/ecs_build.yml@51a06bbc08eb65018238b144d0ad8bfd707a8ffa # v0.0.50
    permissions:
      contents: write
      id-token: write
    with:
      repo-name: tdr-consignment-api
      image-name: consignment-api
      snapshot: ${{ inputs.snapshot == true }}
      build-command: |
        docker build -f Dockerfile-tests -t tests .
        sbt assembly
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_TDR }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if [ "$SNAPSHOT" = "true" ]; then
            gh workflow run deploy.yml -f environment=dev -f to-deploy=$NEXT_VERSION
          else
            gh workflow run deploy.yml -f environment=intg -f to-deploy=$NEXT_VERSION
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot == true }}
